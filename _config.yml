title: À propos de moi un peu plus
layout: text
content: |
En dehors de mon travail en DevOps, je suis passionné par les technologies et les jeux vidéo sur PC, les jeux de société pour leur dimension stratégique, la randonnée et le football.

Je suis également papa et j’adore passer du temps en famille, m’amuser et partager des moments avec mon fils, ce qui me permet de développer patience, créativité et esprit d’équipe.

Ces activités personnelles renforcent des qualités que j’applique également dans mon travail : curiosité, persévérance, sens de l’organisation et capacité à collaborer efficacement au sein d’équipes techniques.

