layout: left
title: '<img src="images/logo_sg.png" height="60"><br><br>Société Générale (Mission ASTRELYA)'
sub_title: Ingénieur DevOps
caption: Février 2024 – Aujourd’hui
link: https://www.societegenerale.com
quote: >
La Société Générale est l’un des principaux groupes bancaires européens, reconnue pour son innovation et la modernisation de son SI.
description: |
J’interviens sur la modernisation des environnements techniques et l’automatisation des processus d’exploitation au sein du SI de la Société Générale.<br><br>
• Mise en place et maintenance de workflows GitHub Actions pour automatiser les processus de build et de déploiement des applications back-end, front-end et batchs.
• Développement d’automatisations en Python, intégrées aux workflows GitHub Actions, afin de standardiser et fiabiliser les opérations d’administration.
• Conception et mise en place de solutions de gestion des accès et opérations techniques (RBAC) via GitHub Actions et Python sur plusieurs composants de la plateforme.
• RabbitMQ : création de comptes utilisateurs et de service, mise à jour des mots de passe, replay de messages depuis les DLQ, suppression de queues sans consommateur et purge de queues DLQ.
• PostgreSQL : création et suppression de schémas, utilisateurs et owners, ainsi que mise à jour des mots de passe utilisateurs.
• Azure : développement d’une automatisation de gestion des secrets permettant de vérifier, créer ou mettre à jour, supprimer, rechercher et lister les secrets par service ou les secrets communs.
• Vault : création de chemins, ajout et mise à jour de secrets, suppression, listing de clés, recherche de clés et de valeurs, comparaison de contenus Vault et gestion des clés communes.
• Kubernetes : automatisation de la relance d’un service ou de l’ensemble des services d’une plateforme au niveau d’un namespace.
• Elasticsearch / Kibana : création de comptes de service et de comptes utilisateurs applicatifs, mise à jour des mots de passe et création de comptes dédiés au monitoring.
• Administration du cloud privé DoItNow, incluant l’intégration, la supervision et la maintenance de composants tels que RabbitMQ, OpenShift (OCP), PostgreSQL, Elasticsearch, Kibana, Vault, DNS et certificats.
• Migration des instances Grafana vers une instance Dataviz pour unifier et fiabiliser le monitoring.
• Migration des bases Oracle GEN1 vers GEN2 sur cloud privé (OCP), avec automatisation de la création des instances via Terraform afin de fiabiliser et d’accélérer les déploiements.
• Automatisation et orchestration de tâches via Kubernetes CronJobs et Python.
• Optimisation du logging et amélioration de la fiabilité des scripts Python en production.
• Participation au décommissionnement progressif des environnements et services GEN1.
• Documentation technique et partage des bonnes pratiques au sein de l’équipe.
• Support en production et gestion de crises, incluant des interventions en dehors des horaires ouvrés.
• Veille technologique continue sur les outils DevOps, l’automatisation, le Cloud et l’observabilité.

