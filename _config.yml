# About Section
about_title: À propos de moi
about_profile_image: images/profile.jpg
about_content: |
  Bonjour, je suis Nicolas, **Ingénieur DevOps** avec 10 ans d’expérience dans les environnements de production et l’automatisation des infrastructures.<br><br>
  Après plusieurs années en production informatique puis plus de 6 ans en DevOps, j’ai acquis une expertise complète dans l’**industrialisation des environnements techniques**, l’**automatisation des processus** et la **supervision des systèmes complexes**.<br><br>
  J’ai eu l’opportunité de travailler pour des entreprises majeures telles que <mark>Bnp Paribas</mark>, <mark>Orange</mark>, <mark>Euronext</mark> et actuellement <mark>Société Générale</mark>, où je contribue à la modernisation et à l’automatisation du système d’information.<br><br>
  Ce qui me motive dans ce rôle, c’est de pouvoir travailler avec des **technologies de pointe**, d’**automatiser** les processus et d’**optimiser** les environnements techniques tout en continuant à apprendre et à innover.<br><br>
  **Domaines d’expertise :**<br><br>
    - Infrastructure as Code (**Terraform**, **Ansible**)<br><br>
    - Pipelines CI/CD (**Jenkins**, **GitLab CI**, **GitHub Actions**)<br><br>
    - Orchestration de conteneurs (**Docker**, **Kubernetes**)<br><br>
    - Cloud & plateformes (**Microsoft Azure**, **DoItNow**, **OpenShift (OCP)**)<br><br>
    - Supervision et observabilité (**Grafana**, **ELK Stack**)<br><br>
    - Code (**Python**)<br><br>

content:

  - title: Expériences
    layout: list
    content:
      - layout: left
        title: '<img src="images/logo_sg.png" height="60"><br><br>Société Générale (Mission ASTRELYA)'
        sub_title: Ingénieur DevOps
        caption: Février 2024 – Aujourd’hui
        link: https://www.societegenerale.com
        quote: >
          Mission DevOps orientée automatisation, cloud privé, self-service et fiabilisation des environnements de production.
        description: |
          • **CI/CD & automatisation** : mise en place et maintenance de workflows **GitHub Actions**, automatisation et orchestration de tâches via **Kubernetes CronJobs** et **Python**.  
          • **Cloud & plateformes** : administration du cloud privé **DoItNow / OpenShift (OCP)** et exploitation de composants **RabbitMQ**, **PostgreSQL**, **Elasticsearch**, **Kibana**, **Vault**, **DNS** et **certificats**.  
          • **Self-service & RBAC** : développement d’actions automatisées pour **RabbitMQ**, **PostgreSQL**, **Azure Secrets**, **Vault**, **Kubernetes** et **Elasticsearch** couvrant la gestion des comptes, mots de passe, secrets, schémas, clés et opérations d’exploitation (DLQ, queues, relance de services).  
          • **Monitoring & observabilité** : mise en place d’**alertes Azure** sur les pods en échec, **RabbitMQ** et **PostgreSQL**, migration des instances **Grafana** vers **Dataviz** et optimisation des logs.  
          • **Migration & Infrastructure as Code** : migration des bases **Oracle GEN1 vers GEN2** sur OCP et automatisation du déploiement des instances via **Terraform**, avec décommissionnement progressif des environnements GEN1.  
          • **Production & environnement international** : support en production et gestion de crises ; mission réalisée à environ **70 % en anglais** (documentation technique, e-mails, Teams et échanges avec les équipes internationales).

      - layout: left
        title: '<img src="images/logo_euronext.png" height="90"><br><br>Euronext (Mission ASTRELYA)'
        sub_title: Ingénieur DevOps
        caption: Octobre 2021 – Février 2024
        link: https://www.euronext.com
        quote: >
          Mission DevOps centrée sur l’observabilité, la centralisation des logs et l’automatisation des déploiements.
        description: |
          Intégré à l’équipe DevOps d’Euronext, j’ai travaillé sur la **centralisation des logs et métriques applicatives** afin d’améliorer l’observabilité et la supervision.<br><br>
          • Centralisation des **logs applicatifs** et **métriques systèmes** on-premises, avec supervision des **Kafka topics** et **MySQLd Exporter**.  
          • Modification d’une **Lambda AWS** pour collecter et centraliser les logs **CloudWatch**.  
          • Automatisation de l’installation et du déploiement via **Ansible** (playbooks, rôles) et **Jenkins**.  
          • Gestion du **versioning** et des **releases** via **Git**, **Jira** et **Jenkins**.  
          • Développement de **scripts Python** et rédaction de documentation technique sous **Confluence**.

      - layout: left
        title: '<img src="images/logo_orange.png" height="120"><br><br>Orange (Mission UMANIS)'
        sub_title: DevOps Engineer
        caption: Mai 2020 – Octobre 2021
        link: https://www.orange.com
        quote: >
          Industrialisation et automatisation des opérations à travers le développement d’automates.
        description: |
          Membre de l’équipe DOMA (DévelOppement-AutoMAtisation), j’ai contribué au **développement et au maintien d’automates** destinés à l’industrialisation des processus d’Orange.<br><br>
          • Développement et maintien d’automates via **Ansible** et **Python**, de la phase de test à la mise en production.  
          • Création et ordonnancement de **workflows HPOO** et maintien en condition opérationnelle des automates.  
          • Développement d’**actions AMADEUS** permettant aux clients de déclencher les automates de manière autonome.  
          • Gestion du code source via **GitLab**, suivi agile sous **JIRA** et rédaction de documentation technique et fonctionnelle.

      - layout: left
        title: '<img src="images/logo_bnp.png" height="70"><br><br>BNP Paribas (Mission UMANIS)'
        sub_title: Ingénieur de production informatique
        caption: Décembre 2017 – Mai 2020
        link: https://group.bnpparibas
        quote: >
          Production informatique, automatisation et maintien en conditions opérationnelles d’environnements critiques.
        description: |
          Administration, analyse et résolution de problèmes applicatifs impactant les environnements de production BNP Paribas.<br><br>
          • **Pilotage opérationnel** : management, formation des nouveaux arrivants, animation des réunions de suivi et gestion des tâches problèmes via **ITSM** et **SharePoint**.  
          • **Automatisation & ordonnancement** : développement de tâches en **Shell/Bash**, supervision des chaînes via **Autosys** et mise en place de purges automatisées sous **AIX/Linux**.  
          • **Administration & production** : gestion des bases **Oracle / MS SQL**, serveurs **WebSphere**, comptes sécurisés **eTac / Entrust** et archivage **TSM**.  
          • **Supervision & transferts** : monitoring via **Nimsoft**, supervision des transferts sécurisés **CFT** et documentation opérationnelle.

      - layout: left
        title: '<img src="images/logo_bnp.png" height="70"><br><br>BNP Paribas (Mission UMANIS)'
        sub_title: Analyste d’exploitation (alternance)
        caption: Janvier 2015 – Décembre 2017
        link: https://group.bnpparibas
        quote: >
          Exploitation et administration d’environnements de production bancaire.
        description: |
          Traitement d’incidents de production et maintien en conditions opérationnelles.<br><br>
          • Administration des **bases Oracle / MS SQL**, **WebSphere** et comptes sécurisés **eTac / Entrust**.  
          • Ordonnancement et exploitation via **Autosys / TNG**, analyse de scripts **Shell/Bash** et gestion des **File Systems AIX/Linux**.  
          • Sauvegarde via **TSM**, supervision des transferts **CFT** et rédaction de documentation opérationnelle.

      - layout: left
        title: '<img src="images/logo_bnp.png" height="70"><br><br>BNP Paribas'
        sub_title: Technicien de support (stage)
        caption: Avril 2014 – Juin 2014
        link: https://group.bnpparibas
        quote: >
          Support informatique et administration du parc utilisateurs.
        description: |
          • Support utilisateurs et résolution d’incidents techniques.  
          • Gestion du parc via **I-P@rk**, maintenance du matériel et administration des utilisateurs via **Active Directory**.

