About Section

about_title: À propos de moi
about_profile_image: images/profile.jpg
about_content: |
Bonjour, je suis Nicolas, Ingénieur DevOps avec plus de 10 ans d’expérience dans les environnements de production, l’automatisation et la modernisation des infrastructures.<br><br>
Après plusieurs années en tant qu’ingénieur de production puis en DevOps, j’ai développé une solide expérience dans l’industrialisation des environnements techniques, l’automatisation des processus d’exploitation et la fiabilisation des opérations en production.<br><br>
J’ai eu l’opportunité de travailler pour des entreprises majeures telles que <mark>BNP Paribas</mark>, <mark>Orange</mark>, <mark>Euronext</mark> et actuellement <mark>Société Générale</mark>, où je contribue à la modernisation et à l’automatisation du système d’information.<br><br>
Ce qui me motive dans ce rôle, c’est de concevoir des solutions permettant de réduire les opérations manuelles, de standardiser les processus, de fiabiliser les environnements techniques et de continuer à apprendre de nouvelles technologies.<br><br>
Domaines d’expertise :<br><br>
- Automatisation et Infrastructure as Code (Python, Terraform, Ansible)<br><br>
- CI/CD et automatisation de workflows (GitHub Actions, Jenkins, GitLab)<br><br>
- Conteneurisation et plateformes (Kubernetes, OpenShift)<br><br>
- Gestion des accès, secrets et opérations techniques (Vault, RBAC, Azure)<br><br>
- Middleware et bases de données (RabbitMQ, PostgreSQL, Oracle)<br><br>
- Supervision et observabilité (Grafana, Elasticsearch, Kibana)<br><br>

